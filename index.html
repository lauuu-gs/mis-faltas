<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis faltas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D2C1F7">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap');

  :root{
    --bg:#EFEDFB;
    --ink:#211E3D;
    --ink-soft:#6A6690;
    --card-shadow: 0 10px 24px rgba(33,30,61,0.10);
    --c1:#CDF29A;   /* verde lima */
    --c1-deep:#8FCB4F;
    --c2:#F7B4D6;   /* rosa */
    --c2-deep:#E77CB0;
    --c3:#AECBF7;   /* azul */
    --c3-deep:#6E9DE8;
    --c4:#FFD98A;   /* amarillo */
    --c4-deep:#F0B347;
    --c5:#D2C1F7;   /* lila */
    --c5-deep:#A582EA;
    --danger:#F0693F;
    --danger-bg:#FFE1D3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito',-apple-system,sans-serif;
    position:relative;
    overflow-x:hidden;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    z-index:0;
    opacity:0.5;
  }
  .blob1{width:220px;height:220px;background:#DCD7FA;top:-70px;right:-60px;}
  .blob2{width:140px;height:140px;background:#FBE0EE;bottom:10%;left:-60px;}

  .wrap{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:40px 20px 90px;
  }
  header{ margin-bottom:26px; }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:2.1rem;
    font-weight:800;
    margin:0 0 6px;
    line-height:1.05;
  }
  .subtitle{
    font-size:0.95rem;
    color:var(--ink-soft);
    font-weight:700;
  }

  .subject{
    border-radius:32px;
    padding:22px 22px 20px;
    margin-bottom:20px;
    box-shadow:var(--card-shadow);
    position:relative;
    overflow:hidden;
  }
  .subject.c1{background:var(--c1);}
  .subject.c2{background:var(--c2);}
  .subject.c3{background:var(--c3);}
  .subject.c4{background:var(--c4);}
  .subject.c5{background:var(--c5);}

  .subj-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
  }
  .subj-name{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:1.15rem;
    line-height:1.2;
    max-width:70%;
  }
  .subj-total{
    font-size:0.78rem;
    font-weight:700;
    color:var(--ink);
    opacity:0.6;
    margin-top:4px;
  }
  .subj-count{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:1.5rem;
    white-space:nowrap;
    text-align:right;
  }
  .subj-count small{
    display:block;
    font-family:'Nunito',sans-serif;
    font-size:0.68rem;
    font-weight:700;
    opacity:0.65;
    margin-top:-2px;
  }

  .card-body{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:14px;
  }
  .mascot{ flex-shrink:0; }

  .progress-wrap{ flex:1; min-width:0; }
  .bar-track{
    height:12px;
    background:rgba(255,255,255,0.55);
    border-radius:999px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:999px;
    transition:width .35s ease;
  }
  .mini-row{
    display:flex;
    justify-content:space-between;
    font-size:0.72rem;
    font-weight:700;
    color:var(--ink);
    opacity:0.7;
    margin-top:6px;
  }

  .flag{
    display:inline-block;
    margin-top:8px;
    padding:4px 12px;
    border-radius:999px;
    font-size:0.72rem;
    font-weight:800;
    background:var(--danger-bg);
    color:var(--danger);
  }

  .controls{
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:2px;
    background:#fff;
    border-radius:999px;
    box-shadow:0 3px 8px rgba(33,30,61,0.12);
    padding:4px;
  }
  .stepper button{
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink);
    font-size:1.2rem;
    font-weight:800;
    cursor:pointer;
    font-family:'Nunito',sans-serif;
  }
  .stepper button:hover{ background:var(--bg); }
  .stepper button:disabled{ opacity:0.3; cursor:not-allowed; }
  .stepper button:disabled:hover{ background:transparent; }
  .stepper .unit-label{
    padding:0 8px;
    font-size:0.78rem;
    font-weight:800;
    color:var(--ink-soft);
    min-width:34px;
    text-align:center;
  }

  .chip-group{
    display:flex;
    gap:6px;
  }
  .chip{
    border:none;
    padding:8px 13px;
    border-radius:999px;
    font-family:'Nunito',sans-serif;
    font-size:0.75rem;
    font-weight:800;
    background:rgba(255,255,255,0.55);
    color:var(--ink);
    cursor:pointer;
  }
  .chip.active{
    background:#fff;
    box-shadow:0 3px 8px rgba(33,30,61,0.15);
  }

  footer{
    margin-top:10px;
    font-size:0.75rem;
    font-weight:700;
    color:var(--ink-soft);
    text-align:center;
  }
  .loading{padding:60px 0;text-align:center;color:var(--ink-soft);font-weight:700;}
</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="wrap">
  <header>
    <h1>Tus faltas</h1>
    <div class="subtitle">Asistencia mínima: 60% en cada asignatura</div>
  </header>
  <div id="app"><div class="loading">Cargando…</div></div>
  <footer id="syncStatus">Cargando…</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUBJECTS = [
  { id:'ddc2', name:'Data Driven Corporations II',               total:58, min:34.8, max:23, durations:[1,2], color:'c3' },
  { id:'ia',   name:'Inteligencia Artificial y Redes Neuronales', total:55, min:33.0, max:22, durations:[1,2], color:'c2' },
  { id:'bd2',  name:'Aplicaciones Big Data II',                   total:41, min:24.6, max:16, durations:[2],   color:'c1' },
  { id:'bd4',  name:'Aplicaciones Big Data IV (Black Ops)',       total:32, min:19.2, max:12, durations:[2],   color:'c4' },
  { id:'bd3',  name:'Aplicaciones Big Data III (Industria 4.0)',  total:30, min:18.0, max:12, durations:[2],   color:'c5' },
];

const DEEP = { c1:'#8FCB4F', c2:'#E77CB0', c3:'#6E9DE8', c4:'#F0B347', c5:'#A582EA' };

// --- Configuración de Supabase -------------------------------------------
// TODO: sustituye estos dos valores por los de tu proyecto (ver instrucciones).
const SUPABASE_URL = 'https://vsfoheujuaiuseuwrjah.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'TU-ANON-sb_secret_55LTkzzipYjSfJjOUJkzzQ_hHgC-81Z';

const LOCAL_CACHE_KEY = 'faltas-horas-cache';

let data = {};
let unitSel = {};
let supabaseClient = null;

if (window.supabase && !SUPABASE_URL.includes('TU-PROYECTO') && !SUPABASE_ANON_KEY.includes('TU-ANON-KEY')) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function setSyncStatus(text){
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = text;
}

function readLocalCache(){
  try{
    const raw = localStorage.getItem(LOCAL_CACHE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}

function writeLocalCache(){
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(data)); }
  catch(e){ console.error('No se pudo guardar la copia local', e); }
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

async function fetchFromSupabase(retries = 2){
  for(let attempt = 0; attempt <= retries; attempt++){
    try{
      const { data: rows, error } = await supabaseClient.from('faltas').select('asignatura_id, horas');
      if (error) throw error;
      return rows;
    }catch(e){
      if (attempt === retries) throw e;
      await wait(500 * (attempt + 1));
    }
  }
}

async function saveSubject(id, retries = 2){
  writeLocalCache();
  if (!supabaseClient) { setSyncStatus('📴 Guardado solo en este dispositivo (Supabase no configurado)'); return; }

  setSyncStatus('☁️ Guardando…');
  for(let attempt = 0; attempt <= retries; attempt++){
    try{
      const { error } = await supabaseClient
        .from('faltas')
        .upsert(
          { asignatura_id: id, horas: data[id], updated_at: new Date().toISOString() },
          { onConflict: 'asignatura_id' }
        );
      if (error) throw error;
      setSyncStatus('☁️ Sincronizado');
      return;
    }catch(e){
      if (attempt === retries){
        console.error('No se pudo guardar en Supabase tras varios intentos', e);
        setSyncStatus('⚠️ Sin conexión: guardado solo en este dispositivo');
        return;
      }
      await wait(500 * (attempt + 1));
    }
  }
}

function subscribeRealtime(){
  if (!supabaseClient) return;
  supabaseClient
    .channel('faltas-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'faltas' }, (payload) => {
      const row = payload.new;
      if (!row || typeof row.horas !== 'number' && typeof row.horas !== 'string') return;
      const horas = Number(row.horas);
      if (data[row.asignatura_id] === horas) return;
      data[row.asignatura_id] = horas;
      writeLocalCache();
      render();
      setSyncStatus('☁️ Actualizado desde otro dispositivo');
    })
    .subscribe();
}

async function load(){
  SUBJECTS.forEach(s => { unitSel[s.id] = s.durations[s.durations.length - 1]; });

  let loaded = null;
  if (supabaseClient){
    try{
      const rows = await fetchFromSupabase();
      loaded = {};
      rows.forEach(r => { loaded[r.asignatura_id] = Number(r.horas); });
      setSyncStatus('☁️ Sincronizado');
    }catch(e){
      console.error('No se pudo cargar de Supabase, uso la copia local', e);
      setSyncStatus('⚠️ Sin conexión: mostrando copia local');
    }
  } else {
    setSyncStatus('📴 Supabase no configurado: solo almacenamiento local');
  }

  if (!loaded) loaded = readLocalCache();

  SUBJECTS.forEach(s => {
    data[s.id] = typeof loaded[s.id] === 'number' ? loaded[s.id] : 0;
  });

  writeLocalCache();
  render();
  subscribeRealtime();
}

function fmt(n){ return (Math.round(n*10)/10).toString().replace('.',','); }

function mascotSVG(state, ink){
  // state: 'happy' | 'mid' | 'worried'
  let mouth;
  if(state === 'happy'){
    mouth = '<path d="M20 30 Q28 38 36 30" stroke="'+ink+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
  } else if(state === 'mid'){
    mouth = '<line x1="20" y1="32" x2="36" y2="32" stroke="'+ink+'" stroke-width="3" stroke-linecap="round"/>';
  } else {
    mouth = '<path d="M20 36 Q28 28 36 36" stroke="'+ink+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
  }
  return `<svg width="60" height="60" viewBox="0 0 56 56">
    <circle cx="28" cy="26" r="24" fill="#ffffff" fill-opacity="0.75"/>
    <circle cx="19" cy="22" r="3" fill="${ink}"/>
    <circle cx="37" cy="22" r="3" fill="${ink}"/>
    ${mouth}
  </svg>`;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  SUBJECTS.forEach(s=>{
    const used = data[s.id];
    const pct = Math.min(100, (used / s.max) * 100);
    const remaining = s.max - used;
    const deep = DEEP[s.color];
    const unit = unitSel[s.id];
    const state = pct >= 100 ? 'worried' : pct >= 65 ? 'mid' : 'happy';

    const el = document.createElement('div');
    el.className = `subject ${s.color}`;
    el.innerHTML = `
      <div class="subj-top">
        <div>
          <div class="subj-name">${s.name}</div>
          <div class="subj-total">${s.total} h totales · mín. ${fmt(s.min)} h</div>
          ${used >= s.max ? '<div class="flag">Límite superado</div>' : ''}
        </div>
        <div class="subj-count">${fmt(used)}<small>de ${fmt(s.max)} h</small></div>
      </div>
      <div class="card-body">
        <div class="mascot">${mascotSVG(state, deep)}</div>
        <div class="progress-wrap">
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${deep}"></div></div>
          <div class="mini-row">
            <span>${remaining >= 0 ? fmt(remaining)+' h de margen' : 'excedido '+fmt(-remaining)+' h'}</span>
            <span>${Math.round(pct)}%</span>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="stepper">
          <button data-minus="${s.id}" ${used <= 0 ? 'disabled' : ''}>−</button>
          <span class="unit-label">${unit} h</span>
          <button data-plus="${s.id}">+</button>
        </div>
        ${s.durations.length > 1
          ? `<div class="chip-group">
              ${s.durations.map(d=>`<button class="chip ${d===unit?'active':''}" data-unit="${s.id}" data-val="${d}">${d} h</button>`).join('')}
            </div>`
          : ''
        }
      </div>
    `;
    app.appendChild(el);
  });

  app.querySelectorAll('[data-plus]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const id = node.getAttribute('data-plus');
      data[id] += unitSel[id];
      render();
      saveSubject(id);
    });
  });
  app.querySelectorAll('[data-minus]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const id = node.getAttribute('data-minus');
      data[id] = Math.max(0, data[id] - unitSel[id]);
      render();
      saveSubject(id);
    });
  });
  app.querySelectorAll('[data-unit]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const id = node.getAttribute('data-unit');
      unitSel[id] = parseFloat(node.getAttribute('data-val'));
      render();
    });
  });
}

load();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(e => console.error('Service worker no registrado', e));
  });
}
</script>
</body>
</html>
